'Acusativo = objeto direto. Só o masculino muda: <b>der → den</b>, <b>ein → einen</b>. Feminino, neutro e plural ficam iguais.<br>Ich sehe <b>den</b> Mann. Ich habe <b>einen</b> Hund. Ich sehe die Frau, das Kind.',
'<b>können</b> (poder/saber), <b>müssen</b> (ter que), <b>wollen</b> (querer), <b>dürfen</b> (ter permissão), <b>sollen</b> (dever).<br>ich kann, du kannst, er kann. O modal fica na 2ª posição e o outro verbo vai ao fim, no infinitivo: <b>Ich kann Deutsch sprechen.</b>',
'Prefixos como auf-, an-, ein-, mit- se separam no presente e vão ao fim da frase.<br><b>aufstehen</b> → Ich stehe um 7 Uhr <b>auf</b>.<br><b>einkaufen</b> → Wir kaufen heute <b>ein</b>.<br>No Perfekt: aufgestanden, eingekauft.',
'<b>weil</b> (porque) abre oração subordinada: o verbo conjugado vai para o <b>fim</b>.<br>Ich bleibe zu Hause, weil ich krank <b>bin</b>.<br>Já <b>denn</b> não muda a ordem: Ich bleibe zu Hause, denn ich bin krank.',
'Dativo = objeto indireto (a quem). m. <b>dem</b>, f. <b>der</b>, n. <b>dem</b>, plural <b>den</b> (+n no substantivo).<br>Ich gebe <b>der</b> Frau ein Buch.<br>Verbos com dativo: helfen, danken, gefallen. Preposições: mit, bei, nach, von, zu, aus, seit.'],[
'Passado escrito e narrativo. Com sein, haben e modais é comum também na fala.<br>sein: ich <b>war</b>, du warst, wir waren · haben: ich <b>hatte</b> · können: ich <b>konnte</b>.<br>Er war gestern zu Hause. Ich hatte keine Zeit.',
'<b>dass</b> (que) introduz oração subordinada; o verbo conjugado vai ao fim.<br>Ich glaube, dass er morgen <b>kommt</b>. Ich weiß, dass du Zeit <b>hast</b>.<br>Usa-se após glauben, denken, sagen, wissen, hoffen.',
'Irrealidade e pedidos educados. Use <b>würde + infinitivo</b>; para sein e haben, <b>wäre</b> e <b>hätte</b>.<br>Wenn ich Zeit <b>hätte</b>, <b>würde</b> ich reisen.<br>Educado: Könnten Sie mir helfen? Ich hätte gern einen Kaffee.',
'O pronome relativo é o artigo definido (exceto genitivo e dativo plural). O <b>gênero</b> vem do substantivo; o <b>caso</b>, da função na oração. Verbo ao fim, entre vírgulas.<br>Der Mann, <b>der</b> dort steht, ist mein Lehrer. (sujeito)<br>Der Mann, <b>den</b> ich kenne… (objeto direto)',
'<b>werden</b> + particípio.<br>Das Haus <b>wird</b> gebaut. (presente)<br>Das Haus <b>wurde</b> gebaut. (passado)<br>Agente com <b>von</b> + dativo: Das Haus wird von Arbeitern gebaut.',

'Indica posse. Masculino e neutro: <b>des</b> + substantivo com -(e)s. Feminino e plural: <b>der</b>.<br>Das Auto <b>des Mannes</b>. Die Tasche <b>der Frau</b>.<br>Preposições com genitivo: wegen, trotz, während, statt.',
'Discurso indireto formal (jornais). Raiz do infinitivo + -e: er <b>sei</b>, sie <b>habe</b>, er <b>komme</b>.<br>Er sagt, er <b>sei</b> krank. Sie meint, sie <b>habe</b> keine Zeit.<br>Quando a forma coincide com o indicativo, usa-se o Konjunktiv II.',

'Sufixos formam substantivos: <b>-ung</b> (fem.): entscheiden → die Entscheidung · <b>-keit/-heit</b> (fem.): möglich → die Möglichkeit · <b>-er</b> (agente, masc.): lehren → der Lehrer.<br>Muito comum em textos formais.',
'Particípios funcionam como adjetivos e recebem terminação.<br><b>Partizip I</b> (-d): ação em curso: das schlafen<b>de</b> Kind.<br><b>Partizip II</b>: ação concluída: das gelöste Problem.<br>As terminações seguem a declinação dos adjetivos.',

'Formal: Sie, Konjunktiv, nominalização, fórmulas fixas. Informal: du, gírias, contrações.<br>Formal: Ich bitte um Ihre Rückmeldung. Mit freundlichen Grüßen.<br>Informal: Meld dich mal! Bis bald!<br>Adapte ao interlocutor e ao meio.',
'Irreal no passado: <b>hätte/wäre + particípio</b>. Verbos de movimento usam wäre.<br>Wenn ich es gewusst hätte, <b>wäre</b> ich gekommen.<br>Wenn er gelernt hätte, hätte er bestanden.<br>Com modais: Ich hätte kommen können.',
'Particípio + substantivo substitui uma oração relativa.<br>Die Probleme, <b>die gelöst wurden</b> → die <b>gelösten</b> Probleme.<br>Ampliado: die von der Firma gelösten Probleme.<br>Frequente em textos jornalísticos e acadêmicos.',
'Expressões não se traduzem literalmente; aprenda o sentido.<br><b>Das ist mir Wurst</b> = tanto faz.<br><b>Ich verstehe nur Bahnhof</b> = não entendo nada.<br><b>Daumen drücken</b> = torcer.<br>Anote cada uma com uma frase de exemplo.',
'Combinações fixas de verbo + substantivo. O substantivo traz o sentido; o verbo é fixo.<br>eine Entscheidung <b>treffen</b> · Angst <b>haben</b> · in Frage <b>stellen</b> · zur Verfügung <b>stehen</b> · Rücksicht <b>nehmen</b>.<br>Soam mais formais que um verbo simples.',
'<b>trotzdem</b>/<b>dennoch</b> (mesmo assim), <b>hingegen</b>/<b>jedoch</b> (por outro lado), <b>allerdings</b> (porém). <b>deshalb</b> = consequência; <b>außerdem</b> = adição.<br>Er ist krank, <b>trotzdem</b> geht er zur Arbeit. O verbo vem logo após o conector.'],[
'Domínio de nuances culturais.<br><b>Jemandem einen Bären aufbinden</b> = enganar alguém.<br><b>Den Nagel auf den Kopf treffen</b> = acertar em cheio.<br><b>Wer rastet, der rostet</b> = quem para, enferruja.<br>Jornais e podcasts mostram esses usos.',
'Cortesia, hipótese e desejo em registro elevado.<br>Es <b>wäre</b> mir lieb, wenn du <b>kämst</b>. (forma sintética, literária)<br>Forma comum: …wenn du kommen würdest.<br>Prefira formas sintéticas com sein, haben, modais e verbos curtos.',
'Domine sinônimos e registros.<br><b>schnell</b> (neutro) · <b>zügig</b>/<b>rasch</b> (formal) · <b>flott</b> (coloquial).<br><b>anfangen</b> · <b>beginnen</b> (formal) · <b>loslegen</b> (coloquial).<br>Pergunte sempre: em que contexto isso soa natural?',

/* 7 Maiúsculas nos substantivos */
['<h4>A regra</h4><p>Em alemão, <b>todo substantivo</b> começa com letra maiúscula, em qualquer posição da frase. Isso vale para pessoas, coisas e ideias.</p>'+tb(['der Tisch|a mesa|coisa','die Freude|a alegria|ideia','das Auto|o carro|coisa','die Frau|a mulher|pessoa','der Montag|a segunda-feira|dia da semana'])+'<h4>O que fica em minúscula</h4><p>Verbos, adjetivos, advérbios e preposições: <i>gehen, schön, heute, mit</i>.<br>Exemplo: <b>Ich habe ein schönes Auto.</b> (só Auto leva maiúscula; ich vira maiúsculo apenas no início da frase.)</p><h4>Casos especiais</h4>'+tb(['Sie (formal)|sempre maiúsculo|Wie heißen Sie?','Idiomas|maiúsculo|Ich lerne Deutsch.','Dias e meses|maiúsculo|am Montag, im Juli','Nacionalidade (pessoa)|maiúsculo|der Brasilianer','Adjetivo de origem|minúsculo|brasilianisch, deutsch'])+'<p>Atenção: verbos usados como substantivo também ganham maiúscula: <i>essen</i> (comer) → <b>das Essen</b> (a comida). O pronome <b>ich</b> não leva maiúscula no meio da frase.</p>',[
['m','Qual frase está escrita corretamente?',['Ich habe ein Auto.','ich habe ein auto.','Ich habe ein auto.']],
['m','Em “Ich sehe den tisch.”, qual palavra está errada?',['tisch','sehe','den']],
['m','Qual destas palavras fica sempre em minúscula no meio da frase?',['schön','Freude','Wasser']],
['m','Qual frase está correta?',['Am Montag habe ich Unterricht.','Am montag habe ich Unterricht.','am Montag habe ich unterricht.']],
['m','Qual frase usa o pronome formal corretamente?',['Wie heißen Sie?','Wie heißen sie?','wie heißen Sie?']],
['m','Qual frase está correta?',['Ich lerne Deutsch.','Ich lerne deutsch.','ich lerne Deutsch.']],
['m','Qual frase está correta?',['Im Juli ist es warm.','Im juli ist es warm.','Im Juli ist es Warm.']],

['<h4>Os artigos definidos (nominativo)</h4>'+tb(['<b>masculino</b>|<b>feminino</b>|<b>neutro</b>|<b>plural</b>','der Mann|die Frau|das Kind|die Kinder','der Tisch|die Lampe|das Buch|die Bücher'])+'<p>No plural, todos os gêneros usam <b>die</b>. Aprenda cada substantivo <b>junto com o artigo</b>: não “Tisch”, e sim “der Tisch”.</p><h4>Dicas para adivinhar o gênero</h4>'+tb(['<b>der</b> (masc.)|-er (agente), -ling, -ismus, dias, meses, estações|der Lehrer, der Montag, der Sommer','<b>die</b> (fem.)|-ung, -heit, -keit, -schaft, -tion, -in|die Zeitung, die Freiheit, die Freundin','<b>das</b> (neutro)|-chen, -lein, -um, -ment|das Mädchen, das Museum'])+'<p>Atenção: <b>das Mädchen</b> (a menina) é neutro, porque -chen é sempre neutro. Nem sempre o gênero gramatical coincide com o sexo da pessoa.</p>',[

['<h4>ein, eine, ein</h4>'+tb(['<b>masculino</b>|<b>feminino</b>|<b>neutro</b>|<b>plural</b>','ein Mann|eine Frau|ein Kind|— (sem artigo)','ein Tisch|eine Lampe|ein Buch|Bücher'])+'<p>O artigo indefinido <b>não tem plural</b>: diga apenas o substantivo no plural (<i>Das sind Kinder.</i>).</p><h4>Definido ou indefinido?</h4><p>Use <b>ein/eine</b> quando algo aparece pela primeira vez. Depois, use <b>der/die/das</b>.<br><b>Da ist ein Hund. Der Hund ist klein.</b> (Lá há um cachorro. O cachorro é pequeno.)</p><h4>Negação</h4><p>A negação <b>kein/keine</b> tem as mesmas terminações: <i>Das ist kein Hund. Das ist keine Katze.</i></p><p>Atenção: <b>eine</b> (feminino) tem -e no fim; <b>ein</b> (masculino e neutro) não.</p>',[

['<h4>As terminações</h4>'+tb(['<b>pronome</b>|<b>machen</b>|<b>wohnen</b>|<b>arbeiten</b>','ich|mache|wohne|arbeite','du|machst|wohnst|arbeitest','er/sie/es|macht|wohnt|arbeitet','wir|machen|wohnen|arbeiten','ihr|macht|wohnt|arbeitet','sie/Sie|machen|wohnen|arbeiten'])+'<h4>Como funciona</h4><p>Tire o <b>-en</b> do infinitivo para obter o radical e acrescente: -e, -st, -t, -en, -t, -en. Wir e sie/Sie ficam iguais ao infinitivo.</p><p>Atenção a dois casos:<br>• Radical em <b>-t/-d</b> (arbeiten, finden): coloca-se um <b>-e</b> antes de -st e -t: du arbeitest, er arbeitet.<br>• Radical em <b>-s/-ß/-z</b> (heißen, tanzen): em du só entra <b>-t</b>: du heißt, du tanzt.</p><p>Em alemão, um só presente cobre “eu moro” e “eu estou morando”: <i>Ich wohne in Vitória.</i></p>',[

['<h4>As três formas</h4>'+tb(['<b>infinitivo</b>|<b>du</b>|<b>ihr</b>|<b>Sie</b>','kommen|Komm!|Kommt!|Kommen Sie!','machen|Mach!|Macht!|Machen Sie!','warten|Warte!|Wartet!|Warten Sie!','sprechen|Sprich!|Sprecht!|Sprechen Sie!','lesen|Lies!|Lest!|Lesen Sie!','nehmen|Nimm!|Nehmt!|Nehmen Sie!','fahren|Fahr!|Fahrt!|Fahren Sie!','sein|Sei!|Seid!|Seien Sie!'])+'<h4>Regras</h4><p>• <b>du</b>: radical do verbo, sem -st e sem du (Mach!). Verbos com e → i/ie mantêm a mudança (Sprich!, Lies!). A mudança a → ä <b>não</b> ocorre (Fahr!).<br>• <b>ihr</b>: igual ao presente, sem ihr (Macht!).<br>• <b>Sie</b>: verbo + Sie (Machen Sie!).<br>• Separáveis: prefixo no fim (Steh auf!).<br>• Educado: acrescente <b>bitte</b>: <i>Komm bitte!</i></p><p>Atenção: radical em -t/-d recebe -e: <i>Warte!, Arbeite!</i>. O verbo <b>sein</b> é irregular: <i>Sei ruhig!</i> (fique calmo).</p>',[

/* 20 Nominativo */
['<h4>O caso do sujeito</h4><p>O <b>nominativo</b> responde a <b>Wer?</b> (quem) ou <b>Was?</b> (o quê). É o caso do sujeito, que faz a ação, e também do que vem após <b>sein, werden</b> e <b>heißen</b>.</p>'+tb(['<b>masculino</b>|<b>feminino</b>|<b>neutro</b>|<b>plural</b>','der Mann|die Frau|das Kind|die Kinder','ein Mann|eine Frau|ein Kind|Kinder','kein Mann|keine Frau|kein Kind|keine Kinder','mein Mann|meine Frau|mein Kind|meine Kinder'])+'<h4>Exemplos</h4><p><b>Der Mann</b> liest. · Wer liest? — Der Mann.<br><b>Die Frau</b> schläft. · Wer schläft? — Die Frau.<br>Das ist <b>ein Tisch</b>. (depois de sein, nominativo)<br>Er ist <b>Lehrer</b>.</p><p>Atenção: no nominativo, os artigos são exatamente os do dicionário. Só no acusativo e no dativo é que o artigo vai mudar.</p>',[

/* 21 Acusativo */
['<h4>O objeto direto</h4><p>O <b>acusativo</b> responde a <b>Wen?</b> (quem) ou <b>Was?</b> (o quê). Só o <b>masculino</b> muda: der → <b>den</b>, ein → <b>einen</b>, kein → <b>keinen</b>, mein → <b>meinen</b>.</p>'+tb(['<b>caso</b>|<b>masculino</b>|<b>feminino</b>|<b>neutro</b>|<b>plural</b>','nominativo|der / ein|die / eine|das / ein|die','acusativo|<b>den</b> / <b>einen</b>|die / eine|das / ein|die'])+'<p>Ich sehe <b>den</b> Mann. · Ich kaufe <b>einen</b> Tisch. · Ich habe <b>keinen</b> Hunger. · Ich sehe die Frau, das Kind.</p><h4>Pronomes no acusativo</h4>'+tb(['ich → <b>mich</b>|du → <b>dich</b>|er → <b>ihn</b>|sie → <b>sie</b>','es → <b>es</b>|wir → <b>uns</b>|ihr → <b>euch</b>|sie/Sie → <b>sie/Sie</b>'])+'<h4>Preposições com acusativo</h4><p><b>für</b> (para), <b>durch</b> (através), <b>gegen</b> (contra), <b>ohne</b> (sem), <b>um</b> (em torno de): <i>Das Geschenk ist für dich.</i></p>',[

['<h4>O dativo no A1</h4><p>O <b>dativo</b> responde a <b>Wem?</b> (a quem). No A1, ele aparece sobretudo em expressões fixas e depois de certas preposições.</p>'+tb(['<b>caso</b>|<b>masculino</b>|<b>feminino</b>|<b>neutro</b>|<b>plural</b>','nominativo|der|die|das|die','dativo|<b>dem</b>|<b>der</b>|<b>dem</b>|<b>den</b> (+n)'])+'<h4>Expressões úteis</h4>'+tb(['Wie geht es <b>dir</b>?|Como você está?','<b>Mir</b> geht es gut.|Estou bem.','<b>Mir</b> ist kalt / warm.|Estou com frio / calor.','Das gefällt <b>mir</b>.|Eu gosto disso.','Kannst du <b>mir</b> helfen?|Você pode me ajudar?'])+'<h4>Preposições com dativo</h4><p><b>mit</b> (com), <b>nach</b> (para / depois), <b>bei</b> (na casa de), <b>von</b> (de), <b>zu</b> (para), <b>aus</b> (de), <b>seit</b> (desde): <i>mit dem Bus, bei der Arbeit.</i><br>Contrações: <b>zu dem = zum</b>, <b>zu der = zur</b>, <b>bei dem = beim</b>, <b>von dem = vom</b>.</p>',[
